<script>// VividPaper engine · 张指导出品
// Every frame is a pure function of time t: the same t always gives the same picture.
// No CSS animation and no real clock inside draw(); that is what makes seeking, 4× and the self-check work.
'use strict';
const PM = (() => {
  // two layouts. Default: the 3:4 web page. portrait: a native 9:16 video frame where everything visible stays inside the
  // short-video safe area x 80–1000, y 250–1480 (player UI covers the rest); film.js picks it with layout: 'portrait'

    card: { W: 1080, H: 1440, ZONE: { top: 130, bottom: 1190, cap: 1300 }, safe: [20, 16, 1060, 1424], capX: [30, 1050], capW: [940, 960],
      head: [56, 72, 700], dy: 0 },
    portrait: { W: 1080, H: 1920, ZONE: { top: 350, bottom: 1310, cap: 1392 }, safe: [80, 250, 1000, 1480], capX: [80, 1000], capW: [860, 870],
      head: [80, 300, 600], dy: 160 },
  };
  let LY = LAYOUTS.card, W = LY.W, H = LY.H, ZONE = LY.ZONE;   // content lives between ZONE.top and ZONE.bottom; captions below
  const BRAND = '张指导出品', TOOL = 'VividPaper', SLOGAN = '3 分钟看懂一篇论文';
  const COL = {
    bg: '#0B0B0E', panel: '#15151A', fg: '#F4F3EF', sub: '#C9C9CF', dim: '#8A8A92', faint: '#3A3A42', line: '#26262C',
    acc: '#FF6A2C', acc2: '#FFB089', blue: '#5AA9FF', green: '#3DDC97', yellow: '#FFD23F', purple: '#B48CFF', red: '#FF4B4B', white: '#FFFFFF',
  };

  const FONT = {
    cn: (s, w) => `${w} ${s}px -apple-system,"SF Pro Text","Helvetica Neue",Arial,${CN}`,
    mono: (s, w) => `${w} ${s}px ui-monospace,"SF Mono",Menlo,Consolas,monospace`,
    disp: (s, w) => `${w} ${s}px -apple-system,"SF Pro Display","Helvetica Neue",Arial,${CN}`,
  };

  // ---------- math ----------
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;

    lin: k => k,
    out: k => 1 - Math.pow(1 - k, 3),
    in: k => k * k * k,
    io: k => (k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),

  // how far a colour stands out from the background, 0–255 per channel at most (the measure video-studio safe.py uses)
  function standout(c, a = 1) {
    const rgb = s => { let m; if (/^#[0-9a-f]{6}$/i.test(s)) { const n = parseInt(s.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255, 1]; }
      if ((m = /rgba?\(([^)]+)\)/.exec(s))) { const v = m[1].split(',').map(Number); return [v[0], v[1], v[2], v[3] ?? 1]; } return null; };

  }

  const IMG = {}, CACHE = {};

  // ---------- timeline ----------
  // A caption line stays up long enough to be read: ~0.17 s per Chinese character, 0.3 s per English word.
  function lineDur(s) {
    const t = s.replace(/\*\*/g, '');
    const cjk = (t.match(/[㐀-鿿]/g) || []).length, words = (t.match(/[A-Za-z0-9.√_]+/g) || []).length;

  }
  // Voice-over (optional): build.py fills PM_VOICE.clips from voice/ — spoken text → { src, dur: clip length, end: where the speech ends }.
  // With a clip, a line lasts as long as it takes to say (+ GAP), so every action hung on g.L(i) moves with the voice.
  const GAP = 0.4;
  const txt = q => typeof q === 'string' ? q : q.text;
  // what gets read aloud: `say` verbatim, otherwise the caption without **, with the film's `pronounce` substitutions,
  // then formula notation made sayable — TTS reads x_t as 「x 下划线 t」, N²−N as 「N 平方负 N」 and drops the 1 of x₁
  function spoken(f, q) {
    if (typeof q !== 'string' && q.say != null) return q.say.trim();
    let s = txt(q).replace(/\*\*/g, '');
    Object.entries(f.pronounce || {}).forEach(([a, b]) => { s = s.split(a).join(b); });
    return s
      .replace(/[₀-₉]/g, c => ' ' + (c.charCodeAt(0) - 0x2080))
      .replace(/([A-Za-z0-9Ͱ-Ͽ)²³ā])\s*−\s*/g, '$1 减 ')   // − between two terms is minus; a leading −2 stays negative
      .replace(/²/g, ' 平方').replace(/³/g, ' 立方')
      .replace(/_/g, ' ').replace(/‖/g, '').replace(/\s*→\s*/g, '，')
      .replace(/ {2,}/g, ' ').trim();
  }
  const clipOf = s => (window.PM_VOICE && window.PM_VOICE.clips[s]) || null;
  function timeline(f) {
    const voice = [];   // every piece of narration in order: { sc, t (scene-local start), say, clip }
    // intro: the spoken opening — a string said verbatim, or several pieces (string or { text, say }) said one after another;
    // without it, the default lead-in + question
    const sc = [{ id: 'intro', name: '片头', builtin: 'intro', lines: [], segs: [], dur: 3.6 }];
    const intros = f.intro ? [].concat(f.intro).map(o => typeof o === 'string' ? { text: o.trim(), say: o.trim() } : { text: o.text ?? o.say, say: spoken(f, o) })
      : f.question ? [{ text: '这篇论文回答一个问题：' + txt(f.question), say: '这篇论文回答一个问题：' + spoken(f, f.question) }] : [];
    let ui = 1.0;
    intros.forEach(o => {
      const c = clipOf(o.say); voice.push({ sc: sc[0], t: ui, say: o.say, clip: c });

      // unless introDraw needs the pieces timed (then they run as long as reading them takes)

      sc[0].dur = Math.max(3.6, ui + d + .4); ui += d;
    });
    f.scenes.forEach((s, i) => {
      const lines = [], scene = { ...s, num: i + 1, lines }; let u = s.lead ?? 0.5;
      (s.lines || []).forEach(l => {
        const o = typeof l === 'string' ? { text: l } : l, say = spoken(f, o), c = clipOf(say);
        const d = c ? Math.max(o.dur ?? 0, c.end + GAP + (o.hold || 0)) : o.dur ?? lineDur(o.text) + (o.hold || 0);
        lines.push({ text: o.text, t0: u, t1: u + d }); voice.push({ sc: scene, t: u, say, clip: c }); u += d;
      });
      scene.dur = u + (s.tail ?? 0.8); sc.push(scene);
    });
    // recap items come up one by one: every 1.7 s, or once the previous one has been said
    const recapT = [], olines = []; let u = (f.recap || []).length ? .6 : -.3;   // no recap: the sign-off starts as the outro opens
    if ((f.recap || []).length) {   // spoken lead-in under the 「最后回顾」 heading; silent films don't wait for it
      const say = '我们最后回顾一下', c = clipOf(say);
      voice.push({ sc: null, t: u, say, clip: c }); if (c) { olines.push(...chunks(say, u, c.end + GAP)); u += c.end + GAP; }
    }
    (f.recap || []).forEach(r => {
      const say = spoken(f, r), c = clipOf(say), d = Math.max(1.7, c ? c.end + GAP : 0);
      recapT.push(u); voice.push({ sc: null, t: u, say, clip: c }); if (c) olines.push(...chunks(txt(r), u, d)); u += d;
    });
    // ending: a spoken sign-off after the recap; the credit comes up as it starts
    let endT = null;
    if (f.ending) {
      const say = spoken(f, f.ending), c = clipOf(say); endT = u + .3;
      voice.push({ sc: null, t: endT, say, clip: c }); if (c) { olines.push(...chunks(txt(f.ending), endT, c.end + GAP)); u = endT + c.end + GAP; }
    }

    voice.forEach(v => { v.sc = v.sc || outro; });

  }
  // a spoken passage → caption lines of ≤ 28 characters, cut at punctuation, each up as long as its share of the text
  function chunks(text, t0, dur) {
    const len = s => s.replace(/\*\*/g, '').length, out = [];
    (text.match(/[^。！？；，、：]+[。！？；，、：]?/g) || [text]).forEach(p => {
      const last = out[out.length - 1];   // a new sentence always starts a new caption
      if (last && !/[。！？]$/.test(last) && len(last + p) <= 28) out[out.length - 1] += p; else out.push(p);
    });
    for (let i = 0; i + 1 < out.length; i++) if ((out[i].match(/\*\*/g) || []).length % 2) { out[i] += '**'; out[i + 1] = '**' + out[i + 1]; }   // a **highlight** cut in two stays highlighted on both sides

  }

  }

    let size = o.size ?? 40; const w = o.weight ?? 600, f = FONT[o.font ?? 'cn'];
    X.font = f(size, w);

    const align = o.align ?? 'center';

    text(s, x, y, o = {}) { return rich(spans(s, o.color ?? COL.fg, o.hl ?? COL.acc), x, y, o); },
    rich,
    rect(x, y, w, h, o = {}) {

        X.beginPath(); X.roundRect(x, y, w, h, o.r ?? 14);

        if (o.stroke) { X.strokeStyle = o.stroke; X.lineWidth = o.lw ?? 3; X.setLineDash(o.dash || []); X.stroke(); X.setLineDash([]); }
      });

    },
    circle(x, y, r, o = {}) {
      withA(o.alpha ?? 1, () => {
        X.beginPath(); X.arc(x, y, r, 0, Math.PI * 2);
        if (o.fill) { X.fillStyle = o.fill; X.fill(); }
        if (o.stroke) { X.strokeStyle = o.stroke; X.lineWidth = o.lw ?? 3; X.stroke(); }
      });

    },

    line(x1, y1, x2, y2, o = {}) { return D.path([[x1, y1], [x2, y2]], o); },
    arrow(x1, y1, x2, y2, o = {}) { return D.path([[x1, y1], [x2, y2]], { head: 18, ...o }); },
    // quadratic curve bent sideways by `bend` px
    curve(x1, y1, x2, y2, o = {}) {
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;

          X.lineTo(b[0] - hs * Math.cos(ang - .45), b[1] - hs * Math.sin(ang - .45)); X.lineTo(b[0] - hs * Math.cos(ang + .45), b[1] - hs * Math.sin(ang + .45)); X.closePath(); X.fill();

        { sp, vs: standout(o.color ?? COL.sub, X.globalAlpha * (o.alpha ?? 1)), vf: 0 });
    },
    // a figure from figures/; h omitted → keep aspect. card: true puts it on a white card (paper figures are drawn for white).

const LOOK = '长长的兔子般的耳朵和布满锯齿状牙齿的顽皮笑容的怪物角色';
const CROP = { raw: [.018, .657, .496, .993], enh: [.506, .657, .984, .993] };   // the two Labubu images inside figures/fig6.png
const C_REW = '#FF6A2C', C_GEN = '#5AA9FF', C_JUDGE = '#B48CFF', C_OK = '#3DDC97', C_NO = '#FF4B4B';   // rewriter / generator / judge / ✓ / ✗, same in every scene

// ---------- layout helpers ----------
const FONTSTR = (s, w) => `${w} ${s}px -apple-system,"SF Pro Text","Helvetica Neue",Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif`;
// wrapped paragraph; y is the centre of the first line. o.hl = substrings drawn in o.hlColor; o.k reveals characters (typing)
function para(g, s, x, y, w, o = {}) {
  const size = o.size ?? 30, lh = o.lh ?? Math.round(size * 1.5), wt = o.weight ?? 600, X = g.ctx;
  X.save(); X.font = FONTSTR(size, wt);
  const hl = new Array(s.length).fill(false);
  (o.hl || []).forEach(p => { const i = s.indexOf(p); if (i >= 0) for (let k = i; k < i + p.length; k++) hl[k] = true; });
  const toks = []; const re = /[A-Za-z0-9.\-+]+|./g; let m;
  while ((m = re.exec(s))) toks.push([m[0], m.index]);
  const lines = []; let cur = [], cw = 0;
  for (const [tk, at] of toks) {
    const tw = X.measureText(tk).width;
    if (cw + tw > w && cur.length && !/^[，。、；：！？」）…]$/.test(tk)) { lines.push(cur); cur = []; cw = 0; if (tk === ' ') continue; }
    cur.push([tk, at]); cw += tw;
  }
  if (cur.length) lines.push(cur);
  X.restore();
  const shown = Math.floor((o.k ?? 1) * s.length + 1e-6);
  lines.forEach((ln, li) => {
    const parts = [];
    for (const [tk, at] of ln) for (let c = 0; c < tk.length; c++) {
      const idx = at + c; if (idx >= shown) break;
      const col = hl[idx] ? (o.hlColor ?? g.COL.acc) : (o.color ?? g.COL.fg);
      if (parts.length && parts[parts.length - 1][1] === col) parts[parts.length - 1][0] += tk[c]; else parts.push([tk[c], col]);
    }
    if (parts.length) g.rich(parts, x, y + li * lh, { size, weight: wt, align: 'left', alpha: o.alpha ?? 1 });
  });
  return { n: lines.length, h: lines.length * lh };
}
// a model block: tinted box, name, optional second line
function block(g, name, sub, cx, cy, w, h, color, a = 1, o = {}) {
  const R = { x: cx - w / 2, y: cy - h / 2, w, h, cx, cy, top: cy - h / 2, bottom: cy + h / 2, left: cx - w / 2, right: cx + w / 2 };
  if (a <= .001) return R;
  g.rect(R.x, R.y, w, h, { r: 16, fill: g.rgba(color, .14), stroke: color, lw: 3, alpha: a });
  g.text(name, cx, sub ? cy - 17 : cy, { size: o.size ?? 32, color: g.COL.fg, alpha: a });
  if (sub) g.text(sub, cx, cy + 22, { size: 24, weight: 500, color: g.COL.sub, alpha: a });
  return R;
}
// one of the two Labubu images
function pic(g, which, x, y, w, a = 1) {
  if (a <= .001) return { x, y, w, h: w * .8 };
  return g.img('fig6', x, y, w, null, { crop: CROP[which], radius: 12, alpha: a });
}
// a ✓ / ✗ badge drawn with strokes; k draws it
function tick(g, x, y, ok, a = 1, r = 24) {
  if (a <= .001) return;
  const c = ok ? C_OK : C_NO;
  g.circle(x, y, r, { fill: g.rgba(c, .18), stroke: c, lw: 3, alpha: a });
  if (ok) g.path([[x - r * .45, y + r * .02], [x - r * .1, y + r * .38], [x + r * .5, y - r * .36]], { color: c, lw: 5, alpha: a });
  else { g.line(x - r * .38, y - r * .38, x + r * .38, y + r * .38, { color: c, lw: 5, alpha: a }); g.line(x + r * .38, y - r * .38, x - r * .38, y + r * .38, { color: c, lw: 5, alpha: a }); }
}

  ['比较关系', 8.3], ['实体布局', 7.5], ['组合关系', 7.3], ['状态', 7.0], ['属性一致', 6.6], ['否定', 6.2], ['知识应用', 5.9], ['材质', 5.8],
  ['文字渲染', 4.6], ['手部动作', 4.4], ['动物动作', 3.8], ['包含关系', 2.9], ['艺术风格', 0.9], ['接触互动', 0.0], ['大小', 0.0], ['文字排版', -0.7], ['无接触互动', -0.9]];

// 开场第 2 页：混元生图 2.1 的 Hugging Face 仓库（2026-11-02 截图，600px 宽页面 ×3，figures/hf_head.png + hf_files.png）。

// 页面标签里挂着这篇论文的 arXiv 号 2509.04545。截图分两块：仓库名 + 标签；四个文件夹。
const HF_W = 960, HF_X = 60;
function hfPage(g, a) {
  const { L, Le, COL } = g, at = (i, q) => g.lerp(L(i), Le(i), q), dy = 24 * (1 - a);
  const hA = HF_W * 324 / 1752, hB = HF_W * 486 / 1752, yA = 320 + dy, yB = yA + hA + 56;
  g.img('hf_head', HF_X, yA, HF_W, hA, { radius: 12, alpha: a });
  g.img('hf_files', HF_X, yB, HF_W, hB, { radius: 12, alpha: a });

  const tk = g.p(at(2, .82), .5), tx0 = HF_X + HF_W * .008, tx1 = HF_X + HF_W * .252, ty0 = yA + hA * .66, ty1 = yA + hA * .97;
  g.rect(tx0, ty0, tx1 - tx0, ty1 - ty0, { r: 10, stroke: C_REW, lw: 4, alpha: tk });
  g.text('就是这篇论文', (tx0 + tx1) / 2, yA + hA + 28, { size: 28, color: C_REW, alpha: tk });

  g.rect(HF_X + 8, d0 + 2, HF_W - 16, d1 - d0 - 4, { r: 8, stroke: C_GEN, lw: 4, fill: g.rgba(C_GEN, .12), alpha: dk });

// 回顾文字压到一行（≤ 12 个字），给右边 320 宽的缩略图让位；缩略图跟着各自那条回顾出现
const THUMB = { x: 690, w: 320, h: 124 };
function recapThumbs(g) {
  const TL = PM.timeline(), O = TL.scenes.find(s => s.id === 'outro'); if (!O || !O.recapT) return;
  const draws = [thumbRewriter, thumbThink, thumbGrpo, thumbResult];
  O.recapT.forEach((t0, i) => {
    const a = g.p(t0, .5); if (a <= 0 || !draws[i]) return;
    const y = 330 + i * 170 - THUMB.h / 2, u = (d, len = .5, e) => g.p(t0 + d, len, e);

    draws[i](g, THUMB.x, y, THUMB.w, THUMB.h, a, u);

}
// ① 原话 → 改写器（插进来，训练）→ 生图（不动）
function thumbRewriter(g, x, y, w, h, a, u) {
  const cy = y + 46, ins = u(.3, .6, 'back');
  const box = (s, cx, bw, c, k) => { if (k <= 0) return; g.rect(cx - bw * k / 2, cy - 22, bw * k, 44, { r: 10, fill: g.rgba(c, .16), stroke: c, lw: 2, alpha: a });
    if (k > .8) g.text(s, cx, cy, { size: 24, alpha: a }); };
  box('原话', x + 50, 76, g.COL.sub, 1); box('改写器', x + 160, 100, C_REW, ins); box('生图', x + 270, 76, C_GEN, 1);
  g.arrow(x + 90, cy, x + 108, cy, { color: g.COL.sub, lw: 3, head: 8, k: u(.7, .3), alpha: a });
  g.arrow(x + 212, cy, x + 230, cy, { color: C_REW, lw: 3, head: 8, k: u(.9, .3), alpha: a });
  g.text('训练', x + 160, cy + 50, { size: 24, color: C_REW, alpha: a * u(1.1, .4) });
  g.text('不动', x + 270, cy + 50, { size: 24, color: C_GEN, alpha: a * u(1.3, .4) });

// ② think 里先想（用完变暗）→ answer 里再写
function thumbThink(g, x, y, w, h, a, u) {
  const drop = u(1.6, .5);
  const pane = (px, label, c, n, t0, dashed, al) => {
    g.rect(px, y + 12, 134, h - 24, { r: 10, stroke: c, lw: 2, dash: dashed ? [6, 6] : null, fill: dashed ? null : g.rgba(c, .1), alpha: al });
    g.text(label, px + 12, y + 34, { size: 24, font: 'mono', align: 'left', color: c, alpha: al });
    for (let j = 0; j < n; j++) g.rect(px + 12, y + 56 + j * 16, 110 * [1, .8, .9][j] * u(t0 + j * .2, .4), 7, { r: 3, fill: c, alpha: al * .8 });
  };
  pane(x + 14, 'think', g.COL.dim, 3, .2, true, a * (1 - .6 * drop));
  g.arrow(x + 152, y + h / 2, x + 168, y + h / 2, { color: C_REW, lw: 3, head: 8, k: u(.9, .3), alpha: a });
  pane(x + 172, 'answer', C_REW, 3, 1.0, false, a * u(.9, .3));
}
// ③ 8 个改写各打一个分 → 平均线 → 高于平均变绿、低于变红
function thumbGrpo(g, x, y, w, h, a, u) {
  const S = [.67, 1, .33, .67, 1, .33, .67, 1], mean = S.reduce((p, q) => p + q) / S.length, base = y + h - 14, H = h - 32, sort = u(1.5, .5);
  S.forEach((s, j) => {
    const bx = x + 26 + j * 36, bh = H * s * u(.2 + j * .06, .4);
    g.rect(bx, base - bh, 22, Math.max(2, bh), { r: 4, fill: C_JUDGE, alpha: a });
    if (sort > 0) g.rect(bx, base - bh, 22, Math.max(2, bh), { r: 4, fill: s > mean ? C_OK : C_NO, alpha: a * sort });
  });
  const my = base - H * mean, mk = u(1.0, .5);
  g.line(x + 18, my, x + 18 + (w - 36) * mk, my, { color: g.COL.fg, lw: 2, dash: [6, 5], alpha: a });
}
// ④ 结果条形图：最长三根标橙，整体 +5.1 的虚线
function thumbResult(g, x, y, w, h, a, u) {
  const V = [17.3, 17.2, 15.0, 7.3, 0.9], PX = 15, z = x + 22;

  const lx = z + 5.1 * PX;
  g.line(lx, y + 8, lx, y + 8 + (h - 16) * u(1.0, .5), { color: g.COL.yellow, lw: 3, dash: [6, 5], alpha: a });
}

function followCard(g) {
  const TL = PM.timeline(), O = TL.scenes.find(s => s.id === 'outro'); if (!O || O.endT == null) return;
  const v = TL.voice.find(x => x.sc === O && /欢迎关注/.test(x.say || ''));
  const tE = O.endT, tF = v && v.clip ? (v.t - O.t0) + v.clip.end * .4 : tE + .7;   // the button is pressed as「关注」is said
  const k = g.p(tE - .15, .45), X = g.ctx; if (k <= 0) return;
  const cx = 540, cy = 420, r = 170, im = g.image('avatar');
  X.save(); X.globalAlpha *= k;
  X.fillStyle = g.COL.bg; X.fillRect(0, 140, 1080, 815);
  X.save(); X.beginPath(); X.arc(cx, cy, r, 0, Math.PI * 2); X.clip(); X.imageSmoothingQuality = 'high'; X.drawImage(im, cx - r, cy - r, 2 * r, 2 * r); X.restore();
  X.lineWidth = 6; X.strokeStyle = g.COL.acc; X.beginPath(); X.arc(cx, cy, r + 5, 0, Math.PI * 2); X.stroke();
  X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillStyle = g.COL.fg; X.font = FONTSTR(64, 900); X.fillText('张指导', cx, 680);
  X.fillStyle = g.COL.sub; X.font = FONTSTR(32, 700); X.fillText('大模型硬核技术解读', cx, 745);
  const press = g.clamp((g.t - tF + .05) / .3), done = g.t >= tF + .1, sc = 1 - .1 * Math.sin(Math.PI * press);
  const s = done ? '已关注 ✓' : '＋ 关注'; X.font = FONTSTR(36, 900); const bw = X.measureText(s).width + 90, bh = 80;
  X.translate(cx, 860); X.scale(sc, sc);
  X.beginPath(); X.roundRect(-bw / 2, -bh / 2, bw, bh, bh / 2);
  if (done) { X.lineWidth = 3; X.strokeStyle = g.COL.sub; X.stroke(); } else { X.fillStyle = g.COL.acc; X.fill(); }
  X.fillStyle = done ? g.COL.sub : '#fff'; X.fillText(s, 0, 2);
  X.setTransform(1, 0, 0, 1, 0, 0);
  // 片尾署名换成工具 + 仓库（11-02 用户：看到视频的人要能找到仓库去 star，只写名字带不来 star）。
  // VividPaper 引擎会改成默认这样画（PR feat/brand-config）；合并前本地引擎还画「张指导出品 + 口号」，这里盖掉重画
  X.globalAlpha = 1; X.fillStyle = g.COL.bg; X.fillRect(0, 990, 1080, 175);
  X.globalAlpha = k; X.textAlign = 'center';
  creditDraw(g, X, cx);

}
